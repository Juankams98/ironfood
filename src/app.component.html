
@if (currentUser()) {
  <div class="min-h-screen bg-slate-900 font-sans">
    <header class="bg-slate-800/50 backdrop-blur-sm shadow-lg sticky top-0 z-20">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
        <h1 class="text-3xl font-bold text-lime-400 tracking-wider">
          Iron<span class="text-white">Food</span>
        </h1>
        <button (click)="changeView('profile')" class="p-2 rounded-full text-slate-400 hover:bg-slate-700 hover:text-white transition-colors duration-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-6-3a2 2 0 11-4 0 2 2 0 014 0zM12 12a2 2 0 100-4h-4a2 2 0 100 4h4z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8 pb-24">
      @if (currentView() === 'dashboard') {
        <div class="flex flex-col gap-8">
          <app-dashboard [displayDate]="selectedDate()"></app-dashboard>
        </div>
      } @else if (currentView() === 'calendar') {
        <app-calendar [selectedDate]="selectedDate()" (dateSelected)="handleDateSelected($event)"></app-calendar>
      } @else if (currentView() === 'profile') {
        <app-profile (closeProfile)="changeView('dashboard')"></app-profile>
      }
    </main>
    
    <!-- FAB to open Food Logger -->
    @if (currentView() === 'dashboard' && !isLoggerOpen()) {
      <button (click)="openLogger()" 
              class="fixed bottom-24 right-4 sm:right-6 bg-lime-500 text-slate-900 p-4 rounded-full shadow-lg hover:bg-lime-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-lime-500 transition-transform duration-200 ease-in-out hover:scale-110 z-20 animate-fade-in">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
      </button>
    }
    
    <!-- Food Logger Modal -->
    @if (isLoggerOpen()) {
      <!-- Backdrop -->
      <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 animate-fade-in-fast" (click)="closeLogger()"></div>
      
      <!-- Modal Panel -->
      <div class="fixed bottom-0 left-0 right-0 z-50 max-w-7xl mx-auto animate-slide-up">
        <app-food-logger [logDate]="selectedDate()" (closeRequest)="closeLogger()"></app-food-logger>
      </div>
    }

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-800 border-t border-slate-700 shadow-lg z-30">
      <div class="max-w-7xl mx-auto flex justify-around">
        <button (click)="changeView('dashboard')" class="flex-1 flex flex-col items-center justify-center pt-3 pb-2 text-sm transition-colors duration-200 focus:outline-none" [class.text-lime-400]="currentView() === 'dashboard' || currentView() === 'profile'" [class.text-slate-400]="currentView() !== 'dashboard' && currentView() !== 'profile'">
          <svg class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
          </svg>
          <span>Dashboard</span>
        </button>
        <button (click)="changeView('calendar')" class="flex-1 flex flex-col items-center justify-center pt-3 pb-2 text-sm transition-colors duration-200 focus:outline-none" [class.text-lime-400]="currentView() === 'calendar'" [class.text-slate-400]="currentView() !== 'calendar'">
          <svg class="h-6 w-6 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          <span>Calendar</span>
        </button>
      </div>
    </nav>
  </div>
} @else {
  <app-auth></app-auth>
}
